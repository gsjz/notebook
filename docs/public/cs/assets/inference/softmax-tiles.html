<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线 softmax 加权归约</title><link rel="stylesheet" href="interactive.css">
<style>
:root{color-scheme:light;--ink:#374151;--muted:#6b7280;--accent:#62578a;--soft:#f0eef8;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:13px/1.6 system-ui,sans-serif}.demo{padding:22px;border:1px solid var(--line);border-radius:16px;max-width:1000px;margin:auto}h1{font-size:20px;margin:0 0 4px}p{margin:0}.sub,.note{color:var(--muted);font-size:12px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;min-height:36px;padding:5px 10px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.setting{display:flex;gap:7px;align-items:center;margin-left:auto;color:var(--muted);font-size:12px}.vocab{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.word{min-width:0;text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:7px;background:#fafafa;transition:background .25s,border-color .25s}.word.active{background:var(--soft);border-color:#b7accd}.word.done{border-color:#d8d2e2}.word small{display:block;color:var(--muted);font-size:10px}.word strong{font-weight:600;font-size:15px}.states{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:16px;margin:20px 0}.state{border-top:1px solid var(--line);padding-top:10px}.state span{font-size:11px;color:var(--muted);display:block}.state strong{font-size:19px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}.status{padding:12px;border-radius:9px;background:var(--soft);color:var(--accent);min-height:65px}.result{margin-top:16px;display:flex;gap:24px;flex-wrap:wrap}.result strong{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}.result span{color:var(--muted);font-size:11px;display:block}.note{margin-top:14px}@media(max-width:520px){.demo{padding:16px}h1{font-size:18px}.vocab{grid-template-columns:repeat(4,1fr)}.word{padding:5px 2px}.word small{font-size:10px}.states{gap:10px}.state strong{font-size:16px}.setting{margin-left:0}.result{gap:12px}.result strong{font-size:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main class="demo" id="demo"><h1>逐块读入，保持同一个加权和</h1><p class="sub">8 个词表项，2 维 embedding。后半部分出现更大的 logit，旧状态会重新缩放。</p><div class="controls"><button id="play" class="primary" aria-pressed="false">播放</button><button id="next">合并下一块</button><label class="setting" for="tile">每块词数<select id="tile"><option value="1">1</option><option value="2" selected>2</option><option value="4">4</option></select></label></div><div class="vocab" id="vocab" aria-label="词表 logits 与 embedding"></div><div class="states"><div class="state"><span>运行最大值 m</span><strong id="maximum">—</strong></div><div class="state"><span>分母 ℓ</span><strong id="denominator">0</strong></div><div class="state"><span>分子 a = [a₁, a₂]</span><strong id="numerator">[0, 0]</strong></div></div><p class="status" id="status" aria-live="polite"></p><div class="result"><div><strong id="online-result">—</strong><span>当前 a / ℓ</span></div><div><strong id="reference"></strong><span>完整 softmax 参考结果</span></div><div><strong id="error">—</strong><span>与参考的最大绝对误差</span></div></div><p class="note">教学数据，使用 JavaScript 双精度；不同 tile 的最终结果一致到浮点舍入误差。此处不模拟 GPU 精度、workspace 或时间。</p></main>
<script>
(()=>{'use strict';const logits=[-2,0,1,-1,6,2,0,3],embeddings=[[1,0],[0,1],[1,1],[-1,2],[2,-1],[1,2],[-2,0],[0,3]],byId=id=>document.getElementById(id);let tile=2,end=0,m=-Infinity,l=0,a=[0,0],playing=false,timer=null;const cells=[];logits.forEach((value,i)=>{const cell=document.createElement('div');cell.className='word';cell.innerHTML=`<small>v${i+1}</small><strong>${value}</strong><small>[${embeddings[i]}]</small>`;cell.setAttribute('aria-label',`词${i+1}：logit ${value}，embedding ${embeddings[i]}`);byId('vocab').append(cell);cells.push(cell)});const refMax=Math.max(...logits),refWeights=logits.map(x=>Math.exp(x-refMax)),refDen=refWeights.reduce((x,y)=>x+y,0),ref=[0,1].map(d=>refWeights.reduce((sum,w,i)=>sum+w*embeddings[i][d],0)/refDen);const fmt=x=>Number(x.toFixed(5)).toString(),vec=v=>`[${v.map(fmt).join(', ')}]`;byId('reference').textContent=vec(ref);
function pause(){playing=false;clearTimeout(timer);timer=null}function render(message){cells.forEach((cell,i)=>{cell.classList.toggle('done',i<end);cell.classList.toggle('active',i>=Math.max(0,end-tile)&&i<end)});byId('maximum').textContent=end?fmt(m):'—';byId('denominator').textContent=fmt(l);byId('numerator').textContent=vec(a);const out=end?a.map(x=>x/l):null;byId('online-result').textContent=out?vec(out):'—';byId('error').textContent=out?Math.max(...out.map((x,d)=>Math.abs(x-ref[d]))).toExponential(2):'—';byId('status').textContent=message||(end?`已处理 ${end} / 8 个词表项。`:'点击“合并下一块”，观察最大值、分母和加权分子共同更新。');byId('play').textContent=playing?'暂停':end===8?'重播':'播放';byId('play').setAttribute('aria-pressed',String(playing));byId('next').textContent=end===8?'从头':'合并下一块';Object.assign(document.body.dataset,{processed:String(end),tile:String(tile),maximum:String(m),denominator:String(l),output:JSON.stringify(out),reference:JSON.stringify(ref)})}
function advance(){const from=end,to=Math.min(8,end+tile),nextM=Math.max(m,...logits.slice(from,to)),scale=Math.exp(m-nextM);const oldM=m;let nextL=l*scale,nextA=a.map(x=>x*scale);for(let i=from;i<to;i++){const w=Math.exp(logits[i]-nextM);nextL+=w;nextA=nextA.map((x,d)=>x+w*embeddings[i][d])}m=nextM;l=nextL;a=nextA;end=to;const status=end===8?'全部分块合并完成。a / ℓ 与完整 softmax 加权和一致。':oldM!==-Infinity&&m>oldM?`最大值从 ${fmt(oldM)} 升至 ${fmt(m)}：旧分母和分子先乘 exp(${fmt(oldM)} − ${fmt(m)})，再加入新块。`:`合并词 ${from+1}～${to}，当前最大值 ${fmt(m)}；分母和分子使用相同的指数尺度。`;if(end===8)pause();render(status)}function reset(){pause();end=0;m=-Infinity;l=0;a=[0,0];render()}function schedule(){timer=setTimeout(()=>{if(!playing)return;advance();if(playing)schedule()},1800)}byId('play').addEventListener('click',()=>{if(playing)pause();else{if(end===8)reset();playing=true;schedule()}render()});byId('next').addEventListener('click',()=>{pause();if(end===8)reset();else advance()});byId('tile').addEventListener('change',()=>{tile=Number(byId('tile').value);reset()});document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();render()}});render()})();
</script><script src="frame.js"></script></body></html>
