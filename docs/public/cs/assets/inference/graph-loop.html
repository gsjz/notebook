<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host 循环与设备条件循环</title>
<link rel="stylesheet" href="interactive.css">
<style>
:root{--ink:#374151;--muted:#6b7280;--accent:#62578a;--soft:#f0eef8;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:13px/1.6 system-ui,sans-serif}.demo{border:1px solid var(--line);border-radius:16px;padding:22px;max-width:1000px;margin:auto}h1{font:600 20px/1.4 "Noto Serif CJK SC",serif;margin:0}p{margin:0}.muted,.note{color:var(--muted);font-size:12px}.intro{margin:6px 0 18px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}button{font:inherit;min-height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;color:var(--ink);cursor:pointer}button[aria-pressed=true],button.primary{background:var(--soft);border-color:#c9c0da;color:var(--accent)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.choice{display:flex;gap:4px;margin-right:auto}.step{font-size:12px;color:var(--muted)}.path{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;align-items:stretch;gap:0;margin-bottom:14px}.node{border:1px solid var(--line);border-radius:9px;padding:15px 9px;text-align:center;transition:background .25s,border-color .25s}.node.active{background:var(--soft);border-color:#b8accd}.node strong{display:block;font-weight:600}.node small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.arrow{align-self:center;text-align:center;color:var(--muted)}.state{display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:18px;font-variant-numeric:tabular-nums}.state span{color:var(--muted);font-size:12px}.state b{color:var(--accent);font-size:21px;font-weight:600;margin-right:5px}.explain{background:var(--soft);border-radius:9px;padding:12px 14px;color:var(--accent);margin-top:16px;min-height:66px}.settings{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:18px 0}.settings label{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}input{width:100px}.note{margin-top:14px;font-size:11px}@media(max-width:560px){.demo{padding:16px}.path{grid-template-columns:1fr}.arrow{transform:rotate(90deg);height:20px}.node{padding:10px}.controls{gap:6px}.choice{width:100%;margin-bottom:5px}.choice button{flex:1}.settings{align-items:start}.settings label{flex-wrap:wrap;gap:5px}.state{gap:12px}.explain{min-height:106px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main class="demo" id="demo">
<h1>谁决定下一轮</h1><p class="muted intro">每轮计算相同，改变停止判断所在的位置。</p>
<div class="controls"><div class="choice" role="group" aria-label="控制方式"><button data-mode="host" aria-pressed="true">Host 循环</button><button data-mode="device" aria-pressed="false">设备 WHILE</button></div><button id="play" class="primary" aria-pressed="false">播放</button><button id="next">下一步</button></div>
<div class="path" aria-label="一轮控制路径"><div class="node" id="compute"><strong>GPU 前向与采样</strong><small>计算一次完整去噪轮</small></div><span class="arrow" aria-hidden="true">→</span><div class="node" id="decision"><strong id="decision-title">CPU 读取标志</strong><small id="decision-copy">GPU 完成后等待 host 分支</small></div><span class="arrow" aria-hidden="true">→</span><div class="node" id="continue"><strong id="continue-title">Host 提交下一轮</strong><small id="continue-copy">尚未停止则再次入队</small></div></div>
<p class="explain" id="explain" aria-live="polite"></p>
<div class="state"><span><b id="round">0 / 4</b>已完成轮数</span><span><b id="sync">0</b>轮中 host 标志读取</span><span><b id="condition">1</b>condition</span></div>
<details><summary>示例参数</summary><div class="settings"><label for="stop">收敛轮次 <input id="stop" type="range" min="2" max="8" value="4"><output id="stop-value" for="stop">4</output></label><button id="reset">重置</button></div><p class="muted">最大预算 8 轮</p></details>
<p class="note">控制流示意，不代表实测延迟。设备循环省去轮中 host 读取；输出消费边界仍需依赖同步。每次重播会重置计数与条件。</p>
</main><script src="frame.js"></script><script>
(()=>{'use strict';const id=x=>document.getElementById(x);let mode='host',phase=0,round=0,sync=0,running=false,timer=null,finished=false;const stop=()=>Number(id('stop').value);function pause(){running=false;clearTimeout(timer);timer=null}function reset(){pause();phase=0;round=0;sync=0;finished=false;render()}function render(){document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));id('decision-title').textContent=mode==='host'?'CPU 读取标志':'GPU 更新条件';id('decision-copy').textContent=mode==='host'?'GPU 完成后等待 host 分支':'归约 done，检查步数上限';id('continue-title').textContent=mode==='host'?'Host 提交下一轮':'图内 WHILE 检查';id('continue-copy').textContent=mode==='host'?'尚未停止则再次入队':'condition 非零则执行 body';['compute','decision','continue'].forEach((n,i)=>id(n).classList.toggle('active',!finished&&phase===i));id('round').textContent=`${round} / ${stop()}`;id('sync').textContent=String(sync);id('condition').textContent=round>=stop()?'0':'1';id('stop-value').textContent=String(stop());id('play').textContent=running?'暂停':finished?'重播':'播放';id('play').setAttribute('aria-pressed',String(running));id('next').disabled=finished;const message=finished?`第 ${round} 轮满足示例停止条件，condition = 0，循环结束。${mode==='host'?'每轮都由 CPU 读取标志。':'停止判断留在设备端，未发生轮中 host 标志读取。'}`:phase===0?'GPU 执行当前轮的模型、采样与停止判断。':phase===1?mode==='host'?'等待相关 GPU 工作完成，再把停止结果交给 CPU。':'设备 kernel 汇总停止结果与计数，更新 conditional handle。':round>=stop()?mode==='host'?'CPU 已读到停止标志，不再提交下一轮。':'condition 已为零，WHILE 不再执行下一轮 body。':mode==='host'?'CPU 根据标志选择退出或提交下一轮。':'WHILE 节点检查设备条件，直接决定是否继续 body。';id('explain').textContent=message;Object.assign(document.body.dataset,{mode,round:String(round),hostReads:String(sync),condition:round>=stop()?'0':'1',phase:String(phase),finished:String(finished)})}function advance(){if(finished)return;if(phase===0)phase=1;else if(phase===1){round++;if(mode==='host')sync++;phase=2}else if(round>=stop()||round>=8){finished=true;pause()}else phase=0;render()}function schedule(){timer=setTimeout(()=>{if(!running)return;advance();if(running)schedule()},1000)}id('play').onclick=()=>{if(running)pause();else{if(finished)reset();running=true;schedule()}render()};id('next').onclick=()=>{pause();advance()};id('reset').onclick=reset;id('stop').oninput=reset;document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;reset()});document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();render()}});render()})();
</script></body></html>
