<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEMM 分块与 K 维累加</title><link rel="stylesheet" href="interactive.css">
<style>
:root{color-scheme:light;--ink:#374151;--muted:#6b7280;--accent:#62578a;--soft:#f0eef8;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:13px/1.6 system-ui,sans-serif}.demo{padding:22px;border:1px solid var(--line);border-radius:16px;max-width:1000px;margin:auto}h1{font-size:20px;margin:0 0 4px}p{margin:0}.sub,.note{color:var(--muted);font-size:12px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;min-height:36px;padding:5px 10px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.tile-setting{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.matrices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}.matrix-title{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.matrix-title small{color:var(--muted)}.grid{display:grid;gap:3px;aspect-ratio:1}.cell{border-radius:3px;background:#f0f1f4;transition:background .25s,box-shadow .25s}.cell.active{background:#8b7da8}.cell.acc{background:var(--soft);box-shadow:inset 0 0 0 1px #b7accd}.cell.done{background:#62578a}.status{margin-top:18px;padding:12px;border-radius:9px;background:var(--soft);color:var(--accent);min-height:48px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stats strong{font-size:22px;font-weight:600;color:var(--accent)}.stats span{display:block;font-size:11px;color:var(--muted)}.note{margin-top:12px}@media(max-width:520px){.demo{padding:16px}h1{font-size:18px}.matrices{gap:12px}.matrix-title{display:block}.matrix-title small{display:block}.tile-setting{margin-left:0}.stats{gap:8px}.stats strong{font-size:20px}.cell{border-radius:2px}.grid{gap:2px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main class="demo" id="demo"><h1>一个输出 tile，沿 K 维累加</h1><p class="sub">A 12 × 12 · B 12 × 12 · C 12 × 12；只跟踪左上角一个 CTA。</p>
<div class="controls"><button class="primary" id="play" aria-pressed="false">播放</button><button id="next">下一块</button><label class="tile-setting" for="tile">Tile<select id="tile"><option value="3">3 × 3 × 3</option><option value="4" selected>4 × 4 × 4</option><option value="6">6 × 6 × 6</option></select></label></div>
<div class="matrices"><section><div class="matrix-title">输入 A <small>M × K</small></div><div class="grid" id="matrix-a" role="img" aria-label="A 的当前分块"></div></section><section><div class="matrix-title">输入 B <small>K × N</small></div><div class="grid" id="matrix-b" role="img" aria-label="B 的当前分块"></div></section><section><div class="matrix-title">输出 C <small>M × N</small></div><div class="grid" id="matrix-c" role="img" aria-label="C 的当前累加分块"></div></section></div>
<p class="status" id="status" aria-live="polite"></p><div class="stats"><div><strong id="cta-count"></strong><span>覆盖 C 的 CTA 数</span></div><div><strong id="load-count"></strong><span>每个 K 分块读取元素</span></div><div><strong id="acc-count"></strong><span>本 CTA 累加元素</span></div></div><p class="note">元素计数示意；未模拟缓存、线程布局、边界或真实性能。图中完整矩阵以固定比例显示。</p></main>
<script>
(()=>{'use strict';const S=12,byId=id=>document.getElementById(id),matrices={};let step=0,tile=4,timer=null,playing=false;
for(const name of ['a','b','c']){const host=byId('matrix-'+name);host.style.gridTemplateColumns=`repeat(${S},1fr)`;matrices[name]=[];for(let i=0;i<S*S;i++){const cell=document.createElement('span');cell.className='cell';cell.setAttribute('aria-hidden','true');host.append(cell);matrices[name].push(cell)}}
const total=()=>S/tile;function pause(){playing=false;clearTimeout(timer);timer=null}function render(){for(let i=0;i<S*S;i++){const row=Math.floor(i/S),col=i%S;for(const name of ['a','b','c'])matrices[name][i].className='cell';if(step<total()){if(row<tile&&col>=step*tile&&col<(step+1)*tile)matrices.a[i].classList.add('active');if(col<tile&&row>=step*tile&&row<(step+1)*tile)matrices.b[i].classList.add('active')}if(row<tile&&col<tile)matrices.c[i].classList.add(step===total()?'done':'acc')}
byId('play').textContent=playing?'暂停':step===total()?'重播':'播放';byId('play').setAttribute('aria-pressed',String(playing));byId('next').textContent=step===total()?'从头':'下一块';byId('cta-count').textContent=(S/tile)**2;byId('load-count').textContent=2*tile*tile;byId('acc-count').textContent=tile*tile;byId('status').textContent=step===total()?`已累加全部 ${total()} 个 K 分块，左上 ${tile} × ${tile} 输出 tile 完成。`:`K 分块 ${step+1} / ${total()}：A 的 ${tile} 行 × ${tile} 列，与 B 的 ${tile} 行 × ${tile} 列相乘，累加到同一块 C。`;document.body.dataset.step=step;document.body.dataset.tile=tile;document.body.dataset.total=total()}
function schedule(){timer=setTimeout(()=>{if(!playing)return;step++;if(step===total())pause();render();if(playing)schedule()},1500)}byId('play').addEventListener('click',()=>{if(playing)pause();else{if(step===total())step=0;playing=true;schedule()}render()});byId('next').addEventListener('click',()=>{pause();step=step===total()?0:step+1;render()});byId('tile').addEventListener('change',()=>{pause();tile=Number(byId('tile').value);step=0;render()});document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();render()}});render()})();
</script><script src="frame.js"></script></body></html>
