<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roofline 成本模型</title><link rel="stylesheet" href="interactive.css"><style>.bars{display:grid;gap:18px;margin:24px 0}.row{display:grid;grid-template-columns:68px 1fr 75px;gap:10px;align-items:center;font-size:12px}.track{height:16px;background:#f3f3f6;border-radius:4px}.fill{height:100%;background:var(--accent);border-radius:4px;transition:width .25s}.value{text-align:right;font-variant-numeric:tabular-nums}.row:last-child .fill{background:#a499ba}.bound{font-size:12px;color:var(--muted)}@media(max-width:500px){.row{grid-template-columns:50px 1fr 65px;gap:6px}}</style></head><body><main class="demo"><h1>计算、带宽与提交成本</h1><p class="subtitle">教学平台：20 TFLOP/s、200 GB/s；每次 launch 示意为 5 μs。</p><div class="controls" role="group" aria-label="选择算子形态"><button data-kind="memory" aria-pressed="true">带宽型</button><button data-kind="compute" aria-pressed="false">计算型</button><button data-kind="tiny" aria-pressed="false">小算子</button></div><div class="controls"><label>launch 次数 <input type="range" id="launches" min="1" max="20" value="10"><output id="launch-count">10</output></label></div><div class="bars" id="bars"></div><div class="metrics"><div class="metric"><strong id="time"></strong><small>示意总时间</small></div><div class="metric"><strong id="intensity"></strong><small>FLOPs / byte</small></div></div><p class="caption" id="caption" aria-live="polite"></p><p class="note">总时间模型 = max(计算时间, 内存时间) + launch 次数 × 5 μs。忽略重叠与其他依赖，不是设备预测。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cases={memory:{f:1e9,d:1e9},compute:{f:1e12,d:1e9},tiny:{f:2e6,d:2e5}};let kind='memory';function render(){const {f,d}=cases[kind],n=Number($('launches').value),compute=f/20e12*1e3,memory=d/200e9*1e3,launch=n*.005,total=Math.max(compute,memory)+launch,scale=Math.max(compute,memory,launch);$('launch-count').value=n;$('bars').replaceChildren();[['计算下界',compute],['内存下界',memory],['提交附加',launch]].forEach(([name,t])=>{const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=name;const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=`${Math.max(.5,t/scale*100)}%`;track.append(fill);const value=document.createElement('span');value.className='value';value.textContent=`${t<1?(t*1000).toFixed(1)+' μs':t.toFixed(2)+' ms'}`;row.append(label,track,value);$('bars').append(row)});$('time').textContent=total<1?`${(total*1000).toFixed(1)} μs`:`${total.toFixed(2)} ms`;$('intensity').textContent=(f/d).toFixed(0);$('caption').textContent=kind==='tiny'?'算子很小时，提交成本可能超过实际计算与内存访问。':memory>compute?'带宽下界更高；减少中间张量读写可能比提高算力更直接。':'计算下界更高；提交次数减少，仍受矩阵计算限制。';document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));Object.assign(document.body.dataset,{total:String(total),compute:String(compute),memory:String(memory),launch:String(launch)})}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});$('launches').oninput=render;render()})();
</script><script src="frame.js"></script></body></html>
