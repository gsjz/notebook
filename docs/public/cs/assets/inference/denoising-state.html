<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扩散推理状态</title><link rel="stylesheet" href="interactive.css"><style>
.states{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;margin:20px 0}.cache{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--paper)}.cache strong{display:block;color:var(--accent)}.cache small{display:block;color:var(--muted);margin-top:10px}.tokens{display:flex;gap:8px;margin:12px 0}.token{flex:1;padding:12px 4px;text-align:center;background:var(--soft);border-radius:8px;font-size:20px;transition:background .25s}.token.clean{background:#edf1ef}.sc{font-size:12px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}.progress{display:flex;gap:5px;margin-top:20px}.tick{height:5px;flex:1;background:var(--line);border-radius:4px}.tick.done{background:var(--accent)}@media(max-width:550px){.states{grid-template-columns:1fr;gap:12px}.cache{padding:12px}.cache small{margin-top:4px}}
</style></head><body><main class="demo"><div class="header"><h1>一份缓存，多轮去噪</h1><span class="hint" id="counter">准备</span></div><p class="subtitle">四个位置代表一个 canvas；收敛轮次为教学设定。</p><div class="controls"><button class="primary" id="play" aria-pressed="false">播放</button><button id="next">下一步</button></div><div class="states"><div class="cache"><strong>prefix KV cache</strong><small id="cache-status">由 causal encoder 写入</small><small>prompt + 已完成块</small></div><div><h2 id="canvas-title">当前 canvas</h2><div class="tokens" id="tokens" aria-label="当前四个代表位置"></div><div class="sc" id="sc">Self-conditioning：尚无上轮预测</div></div></div><div class="progress" id="progress" aria-hidden="true"></div><p class="caption" id="caption" aria-live="polite"></p><p class="note">只演示状态生命周期；不模拟真实采样概率、路由或模型质量。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const frames=[['□','□','□','□'],['云','7','流','∿'],['云','在','流','7'],['云','在','流','动'],['云','在','流','动']];let step=0,playing=false,timer;function stop(){playing=false;clearTimeout(timer)}function render(){$('counter').textContent=step===0?'准备':step===5?'已提交':`第 ${step} 轮`;$('play').textContent=playing?'暂停':step===5?'重播':'播放';$('play').setAttribute('aria-pressed',String(playing));$('next').textContent=step===5?'重置':'下一步';$('tokens').replaceChildren();frames[Math.min(step,4)].forEach(t=>{const s=document.createElement('span');s.className='token'+(step===5?' clean':'');s.textContent=t;$('tokens').append(s)});$('cache-status').textContent=step===0?'由 causal encoder 写入':step===5?'干净块重新编码，追加 K / V':'保持只读，复用同一 prefix';$('sc').textContent=step===0?'Self-conditioning：尚无上轮预测':step===5?'本块不再需要下一轮的自条件':step===1?'首轮输入：零 self-conditioning；本轮预测供下一轮使用':'Self-conditioning：上轮分布 → soft embedding → MLP';$('canvas-title').textContent=step===5?'已完成的 canvas':'当前 canvas';$('caption').textContent=['初始化 noisy canvas，准备已有 prefix 的缓存。','读取 prefix cache；canvas 的 attention 与 FFN 全部计算。','继续改写 canvas；本轮 hidden states 与 FFN 输出重新计算。','预测已经清晰，仍需依据完整的停止判据决定。','示意：置信度与稳定性同时满足，结束去噪。','提交干净块；后续块通过 encoder 获得新增缓存。'][step];$('progress').replaceChildren();for(let i=0;i<6;i++){const s=document.createElement('span');s.className='tick'+(i<=step?' done':'');$('progress').append(s)}}function schedule(){timer=setTimeout(()=>{step++;if(step>=5){step=5;stop()}render();if(playing)schedule()},2200)}$('play').onclick=()=>{if(playing)stop();else{if(step===5)step=0;playing=true;schedule()}render()};$('next').onclick=()=>{stop();step=(step+1)%6;render()};document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();render()}});render()})();
</script><script src="frame.js"></script></body></html>
