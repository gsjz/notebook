<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局部加速与请求时间</title><link rel="stylesheet" href="interactive.css"><style>
:root{--ink:#374151;--muted:#6b7280;--accent:#62578a;--soft:#f0eef8;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:13px/1.6 system-ui,sans-serif}.demo{max-width:1000px;margin:auto;border:1px solid var(--line);border-radius:16px;padding:22px}h1{font:600 20px/1.4 "Noto Serif CJK SC",serif;margin:0}p{margin:0}.intro,.note{font-size:12px;color:var(--muted)}.intro{margin:6px 0 20px}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:22px}label{display:flex;gap:8px;align-items:center;font-size:12px}input{width:110px}button{font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:36px;padding:5px 11px;cursor:pointer;color:var(--ink)}button[aria-pressed=true]{background:var(--soft);color:var(--accent);border-color:#c9c0da}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.row{display:grid;grid-template-columns:58px minmax(0,1fr) 52px;gap:12px;align-items:center;margin:18px 0;font-size:12px}.track{height:37px;display:flex;border-radius:6px;overflow:hidden;background:#fafafa}.seg{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-size:11px;transition:width .25s}.other{background:#e9eaee;color:#6b7280}.target{background:var(--accent);color:white}.gap{background:repeating-linear-gradient(135deg,#f2eef8,#f2eef8 4px,#fff 4px,#fff 8px);color:var(--accent)}.end{text-align:right;font-variant-numeric:tabular-nums}.legend{font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}.legend span{display:flex;gap:5px;align-items:center}.swatch{width:10px;height:10px;border-radius:2px}.metrics{display:flex;gap:36px;margin:23px 0 15px}.metrics strong{font-size:27px;color:var(--accent);font-weight:600;line-height:1.2;display:block;font-variant-numeric:tabular-nums}.metrics span{font-size:12px;color:var(--muted)}.observation{background:var(--soft);padding:12px 14px;border-radius:9px;color:var(--accent);min-height:66px}.note{font-size:11px;margin-top:14px}@media(max-width:560px){.demo{padding:16px}h1{font-size:18px}.controls{gap:12px}.row{grid-template-columns:40px minmax(0,1fr) 40px;gap:6px}.seg{font-size:10px}.metrics{gap:25px}.observation{min-height:106px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="demo" id="demo"><h1>kernel 变快，请求能快多少</h1><p class="intro">合成基线 100 ms：其他 GPU 工作 60、目标算子 20、host gap 20。</p><div class="controls"><label for="speed">目标算子加速 <input type="range" id="speed" min="1" max="8" value="2" step="1"><output id="speed-value" for="speed">2×</output></label><button id="gap-toggle" aria-pressed="false">消除 host gap</button></div><div class="row"><span>基线</span><div class="track"><span class="seg other" style="width:60%">其他</span><span class="seg target" style="width:20%">目标</span><span class="seg gap" style="width:20%">等待</span></div><span class="end">100 ms</span></div><div class="row"><span>优化后</span><div class="track"><span class="seg other" style="width:60%">其他</span><span class="seg target" id="target"></span><span class="seg gap" id="gap"></span></div><span class="end" id="total"></span></div><div class="legend"><span><i class="swatch" style="background:#e9eaee"></i>其他 GPU 工作</span><span><i class="swatch" style="background:#62578a"></i>目标算子</span><span><i class="swatch" style="background:#f0eef8"></i>host 等待</span></div><div class="metrics"><div><strong id="speedup"></strong><span>整体加速</span></div><div><strong id="saved"></strong><span>节省时间</span></div></div><p class="observation" id="observation" aria-live="polite"></p><p class="note">仅演示 Amdahl 分解；各阶段按串行相加，省略重叠与动态停止。参数不是任何设备或模型的实测。消除等待是理想对照，实际 graph 仍有调度开销。</p></main><script src="frame.js"></script><script>
(()=>{'use strict';const id=x=>document.getElementById(x);let removeGap=false;function render(){const speed=Number(id('speed').value),target=20/speed,gap=removeGap?0:20,total=60+target+gap;id('speed-value').textContent=`${speed}×`;id('target').style.width=`${target}%`;id('target').textContent=target>=8?'目标':'';id('gap').style.width=`${gap}%`;id('gap').textContent=removeGap?'':'等待';id('total').textContent=`${Number(total.toFixed(1))} ms`;id('speedup').textContent=`${(100/total).toFixed(2)}×`;id('saved').textContent=`${Number((100-total).toFixed(1))} ms`;id('gap-toggle').setAttribute('aria-pressed',String(removeGap));id('observation').textContent=removeGap?`总时间 ${Number(total.toFixed(1))} ms 包含两项收益：算子加速与等待消除，不能全部归给 kernel。`:`目标算子占基线的 20%。即使完全消除它，其他部分不变时整体最多加速 1.25×。`;Object.assign(document.body.dataset,{targetMs:String(target),gapMs:String(gap),totalMs:String(total),speedup:String(100/total)})}id('speed').oninput=render;id('gap-toggle').onclick=()=>{removeGap=!removeGap;render()};render()})();
</script></body></html>
